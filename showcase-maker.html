<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ridea showcase maker</title>
<style>body{margin:0;padding:20px;background:#0b0b1a;color:#f6f3ec;font:15px/1.5 Inter,system-ui,sans-serif}h1{font-weight:500;font-size:24px;margin:0 0 6px}p{color:#9a9cc0;margin:0 0 16px}
button{min-height:48px;padding:0 18px;border:0;border-radius:14px;font:600 15px inherit;background:linear-gradient(135deg,#8b7cff,#e58bd9);color:#0b0b1a;margin:0 8px 12px 0}button.g{background:#1d1d3a;color:#f6f3ec}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.t{background:#14142b;border:1px solid #2a2a4a;border-radius:16px;overflow:hidden}.t img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#1d1d3a}.t div{padding:8px 10px;font-size:13px}.t b{display:block}.t button{min-height:40px;font-size:13px;margin:6px 0 0}</style></head><body>
<h1>Showcase maker</h1><p>Generates the 8 Starter-idea images once. Tap Generate all, redo any you dislike, then Download all and upload the files into a <b>showcase</b> folder in your repo.</p>
<button id="go">Generate all</button><button id="dl" class="g">Download all</button><div id="st" style="margin-bottom:12px;color:#9a9cc0"></div><div class="grid" id="g"></div>
<script>
const API="https://ridea-api.arghya-1001.workers.dev",S=[{"slug": "magical-pets", "title": "Magical Pets", "c": "#2fa39a", "prompt": "A tiny glowing blue dragon cub and a fluffy fox cub playing in an enchanted forest, soft magical light, storybook illustration"}, {"slug": "neon-rain-city", "title": "Neon Rain City", "c": "#b04fe0", "prompt": "Neon-lit cyberpunk city street at night in the rain, reflections on wet ground, cinematic wide shot, purple and teal lights"}, {"slug": "epic-adventure", "title": "Epic Adventure", "c": "#d89a4a", "prompt": "A young explorer standing on a cliff facing a vast golden valley at sunrise, epic adventure, cinematic"}, {"slug": "sky-islands", "title": "Sky Islands", "c": "#6a7be8", "prompt": "Floating islands with waterfalls and a fairytale castle in the sky, golden hour, fantasy world, highly detailed"}, {"slug": "space-voyage", "title": "Space Voyage", "c": "#5a4fc0", "prompt": "An astronaut gazing at a ringed planet through a small spaceship window, deep blue and violet nebula, cinematic"}, {"slug": "cozy-cabin", "title": "Cozy Cabin", "c": "#c98a4c", "prompt": "A cozy wooden cabin in a snowy forest at dawn, warm light in the windows, peaceful, painterly"}, {"slug": "robot-dreams", "title": "Robot Dreams", "c": "#3a6ea5", "prompt": "A small friendly robot sitting on a hill watching shooting stars, dreamy, soft glow, storybook style"}, {"slug": "ocean-secret", "title": "Ocean Secret", "c": "#2a8fa0", "prompt": "A giant whale swimming through glowing underwater caverns with tiny fish, bioluminescent, magical"}],data={};
const g=document.getElementById('g'),st=document.getElementById('st');
g.innerHTML=S.map((s,i)=>`<div class="t"><img id="i${i}" alt=""><div><b>${s.title}</b><button class="g" data-i="${i}">Redo</button></div></div>`).join('');
function shrink(src){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,768/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};im.src=src})}
async function make(i){st.textContent='Generating '+S[i].title+'…';
 const r=await fetch(API+'/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:S[i].prompt})});
 const j=await r.json();if(!r.ok)throw new Error(j.error||'failed');
 data[i]=await shrink('data:image/png;base64,'+j.image);document.getElementById('i'+i).src=data[i];}
document.getElementById('go').onclick=async()=>{for(let i=0;i<S.length;i++){if(data[i])continue;try{await make(i)}catch(e){st.textContent='Stopped: '+e.message+' — tap Generate all to resume';return}}st.textContent='Done. Redo any you dislike, then Download all.'};
g.onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{await make(+b.dataset.i);st.textContent='Redone.'}catch(x){st.textContent=x.message}};
document.getElementById('dl').onclick=()=>{S.forEach((s,i)=>{if(!data[i])return;setTimeout(()=>{const a=document.createElement('a');a.href=data[i];a.download=s.slug+'.jpg';document.body.appendChild(a);a.click();a.remove()},i*500)})};
</script></body></html>
